; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp32c3_custom

[env:esp32c3_custom]
; Pinned: 6.12.0. NOTE: with `framework = espidf, arduino`, PlatformIO resolves
; framework-espidf to 4.4.7 (the version the bundled Arduino-ESP32 core requires),
; NOT the 5.5.0 the standalone platform would otherwise use. Confirmed in the boot
; log (ESP-IDF 4.4.7). This is the version the project is built/validated against.
; Bump deliberately, not implicitly.
platform = espressif32@6.12.0
board = esp32-c3-devkitm-1
framework = espidf, arduino
board_build.flash_size = 4MB
; kivsee-only libs; LDF would otherwise auto-compile them into this env.
lib_ignore =
    kivsee_app
    app_mode
lib_deps = fastled/FastLED@3.10.3
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; Dual-mode binary (Lilum-standalone + networked kivsee). Mode chosen at boot
; from NVS, switched via triple-press. BLE gated out so only one radio is
; ever active (see sdkconfig.kivsee.defaults + orchestra_ble/CMakeLists.txt).
[env:esp32c3_kivsee]
platform = espressif32@6.12.0
board = esp32-c3-devkitm-1
framework = espidf, arduino
board_build.flash_size = 4MB
board_build.partitions = partitions_kivsee.csv
; Per-env generated sdkconfig path so the two variants never share a config.
; PlatformIO has NO sdkconfig.defaults.<env> support; to layer a BLE-disable
; override on top of the shared sdkconfig.defaults we pass IDF's own
; SDKCONFIG_DEFAULTS (last file wins) via cmake_extra_args.
board_build.esp-idf.sdkconfig_path = sdkconfig.esp32c3_kivsee
; -DLILUM_VARIANT=kivsee is a CMake variable (NOT a C define) used to gate
; component registration in CMakeLists — $ENV{PIOENV} and CONFIG_BT_ENABLED both
; proved unreliable at component-eval time, an explicit -D CMake var is not.
board_build.cmake_extra_args = -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.kivsee.defaults" -DLILUM_VARIANT=kivsee
build_flags =
    -D LILUM_KIVSEE=1
    ; Opt-in dev flag (default OFF). Add `-D LILUM_GATE_BYPASS=1` below to skip
    ; the power-on long-press confirmation — useful when iterating on USB,
    ; where battery_power_off() cannot cut the rail and the gate otherwise hangs.
    ; Production / shipped builds: leave this commented out.
    ; -D LILUM_GATE_BYPASS=1
    -DMQTT_MAX_PACKET_SIZE=25000
    -DMQTT_KEEPALIVE=5
    -DMQTT_SOCKET_TIMEOUT=5
    ; Do NOT define DATA_PIN here — it collides with a FastLED template param.
    -DTIME_SERVER_IP=\"10.0.1.200\"
    -DMQTT_BROKER_IP=\"10.0.1.200\"
    -DLED_OBJECT_SERVICE_IP=\"10.0.1.200\"
    -DLED_SEQ_SERVICE_IP=\"10.0.1.200\"
    -DLED_OBJECT_SERVICE_PORT=\"8081\"
    -DLED_SEQ_SERVICE_PORT=\"8082\"
; FastLED is the sole LED driver (single RMT owner); led_engine is shared
; with the kivsee Renderer via led_engine_anim_buffer().
lib_deps =
    fastled/FastLED@3.10.3
    nanopb/Nanopb@0.4.91
    knolleary/PubSubClient@2.8.0
    256dpi/MQTT@2.5.2
    bblanchon/ArduinoJson@6.21.5
    https://github.com/BlumAmir/TimeSyncClientArduino.git
    https://github.com/KivSee/kivsee-render.git
monitor_speed = 115200
monitor_filters = esp32_exception_decoder