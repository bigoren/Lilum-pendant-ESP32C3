; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32c3_custom]
; Pinned: 6.12.0. NOTE: with `framework = espidf, arduino`, PlatformIO resolves
; framework-espidf to 4.4.7 (the version the bundled Arduino-ESP32 core requires),
; NOT the 5.5.0 the standalone platform would otherwise use. Confirmed in the boot
; log (ESP-IDF 4.4.7). This is the version the project is built/validated against.
; Bump deliberately, not implicitly.
platform = espressif32@6.12.0
board = esp32-c3-devkitm-1
framework = espidf, arduino
board_build.flash_size = 4MB
lib_deps = fastled/FastLED
monitor_speed = 115200
monitor_filters = esp32_exception_decoder