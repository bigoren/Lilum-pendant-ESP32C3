; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32c3_custom]
; Pinned: 6.12.0. NOTE: with `framework = espidf, arduino`, PlatformIO resolves
; framework-espidf to 4.4.7 (the version the bundled Arduino-ESP32 core requires),
; NOT the 5.5.0 the standalone platform would otherwise use. Confirmed in the boot
; log (ESP-IDF 4.4.7). This is the version the project is built/validated against.
; Bump deliberately, not implicitly.
platform = espressif32@6.12.0
board = esp32-c3-devkitm-1
framework = espidf, arduino
board_build.flash_size = 4MB
; kivsee_app (lib/) is the networked-animation engine, only used by the
; esp32c3_kivsee env. It pulls WiFi/MQTT/kivsee-render/SPIFFS and includes
; secrets.h, none of which belongs in this frozen standalone build. LDF scans
; all of lib/ per env, so exclude it explicitly.
lib_ignore = kivsee_app
lib_deps = fastled/FastLED@3.10.3
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; ---------------------------------------------------------------------------
; Kivsee env: one binary that contains BOTH runtime modes:
;   - Lilum-standalone mode (FastLED patterns; no radio)
;   - kivsee mode (networked animations over WiFi/MQTT)
; The mode is read from NVS at boot (default: standalone). A button gesture
; switches at runtime; standalone→kivsee is in-place, kivsee→standalone via
; reboot. BLE is gated OUT entirely (see sdkconfig.kivsee.defaults +
; orchestra_ble/CMakeLists.txt) so this env never has two radios.
;
; The networked-animation code is vendored into lib/kivsee_app/ (a PlatformIO
; library, like lib/led_engine) so it can #include the Arduino lib_deps below.
; FastLED is the sole LED driver in both modes — see the lib_deps block.
; ---------------------------------------------------------------------------
[env:esp32c3_kivsee]
platform = espressif32@6.12.0
board = esp32-c3-devkitm-1
framework = espidf, arduino
board_build.flash_size = 4MB
board_build.partitions = partitions_kivsee.csv
; Per-env generated sdkconfig path so the two variants never share a config.
; PlatformIO has NO sdkconfig.defaults.<env> support; to layer a BLE-disable
; override on top of the shared sdkconfig.defaults we pass IDF's own
; SDKCONFIG_DEFAULTS (last file wins) via cmake_extra_args.
board_build.esp-idf.sdkconfig_path = sdkconfig.esp32c3_kivsee
; -DLILUM_VARIANT=kivsee is a CMake variable (NOT a C define) used to gate
; component registration in CMakeLists — $ENV{PIOENV} and CONFIG_BT_ENABLED both
; proved unreliable at component-eval time, an explicit -D CMake var is not.
board_build.cmake_extra_args = -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.kivsee.defaults" -DLILUM_VARIANT=kivsee
build_flags =
    -D LILUM_KIVSEE=1
    ; Opt-in dev flag (default OFF). Add `-D LILUM_GATE_BYPASS=1` below to skip
    ; the power-on long-press confirmation — useful when iterating on USB,
    ; where battery_power_off() cannot cut the rail and the gate otherwise hangs.
    ; Production / shipped builds: leave this commented out.
    ; -D LILUM_GATE_BYPASS=1
    -DMQTT_MAX_PACKET_SIZE=25000
    -DMQTT_KEEPALIVE=5
    -DMQTT_SOCKET_TIMEOUT=5
    ; NOTE: do not put -DDATA_PIN here. FastLED uses DATA_PIN as a template
    ; parameter name internally; a command-line -DDATA_PIN=10 poisons those
    ; declarations and breaks the build. The hardware data pin is defined as
    ; a local macro inside lib/led_engine/led_engine.cpp; the kivsee Renderer
    ; uses led_engine's shared FastLED buffer and never names DATA_PIN itself.
    -DTIME_SERVER_IP=\"10.0.1.200\"
    -DMQTT_BROKER_IP=\"10.0.1.200\"
    -DLED_OBJECT_SERVICE_IP=\"10.0.1.200\"
    -DLED_SEQ_SERVICE_IP=\"10.0.1.200\"
    -DLED_OBJECT_SERVICE_PORT=\"8081\"
    -DLED_SEQ_SERVICE_PORT=\"8082\"
; LED-driver unification (Phase 1 of the runtime-switch redesign): FastLED is
; now the sole driver in this env too, owning the C3's RMT peripheral in both
; Lilum-standalone mode and kivsee mode. The kivsee Renderer fills FastLED's
; shared CRGB buffer (via led_engine_anim_buffer()) and the led_engine ledTask
; calls FastLED.show(). NeoPixelBus is therefore no longer needed; led_engine
; is no longer ignored (we link it as the shared FastLED owner).
; Influxdb metrics are intentionally omitted (no-op on C3).
lib_deps =
    fastled/FastLED@3.10.3
    nanopb/Nanopb@0.4.91
    knolleary/PubSubClient@2.8.0
    256dpi/MQTT@2.5.2
    bblanchon/ArduinoJson@6.21.5
    https://github.com/BlumAmir/TimeSyncClientArduino.git
    https://github.com/KivSee/kivsee-render.git
monitor_speed = 115200
monitor_filters = esp32_exception_decoder